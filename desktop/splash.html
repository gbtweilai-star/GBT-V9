<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;height:100%;background:#0b0f14;color:#e8eef5;
    font-family:"Microsoft YaHei",system-ui,sans-serif;overflow:hidden;user-select:none}
  .wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%}
  .logo{width:84px;height:84px;border-radius:20px;background:#1a2634;display:flex;
    align-items:center;justify-content:center;font-size:44px;margin-bottom:14px}
  h1{font-size:19px;margin:0 0 6px;letter-spacing:1px}
  #msg{font-size:12.5px;color:#8fa3b8}
  .bar{width:220px;height:4px;background:#1a2634;border-radius:2px;margin-top:16px;overflow:hidden}
  .bar i{display:block;height:100%;width:40%;background:#39d0ff;border-radius:2px;
    animation:slide 1.1s ease-in-out infinite}
  @keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(320%)}}
  .base{position:fixed;bottom:10px;font-size:10.5px;color:#5a6b7d}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">🥔</div>
  <h1>GBT小土豆V9</h1>
  <div id="msg">正在启动 Octop 底座…</div>
  <div class="bar"><i></i></div>
  <div class="base">底座：开源项目 Octop · 便携版 1.0.2b4</div>
</div>
</body>
</html>
