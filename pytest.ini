[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# 病因（2026-10-07）：原先没有 testpaths，裸跑 `pytest` 会把打包进来的 Octop 便携运行时
# 里的第三方测试（pywin32 / certifi 等）一并收集 ⇒ 277 个 collection error，真回归被淹。
# 钉死只收本仓 tests/，并显式排除大体积/非本仓目录。
testpaths = tests
norecursedirs = desktop _archive node_modules .git data devoured .venv scratch
