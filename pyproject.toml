[tool.coverage.run]
branch = true
source = ["body", "migrations", "panel", "skills"]
omit = ["tests/*", "**/__pycache__/*"]

[tool.coverage.report]
show_missing = true
precision = 1
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.pytest.ini_options]
addopts = [
  "--cov=body", "--cov=migrations", "--cov=panel", "--cov=skills",
  "--cov-report=term-missing", "--cov-report=json:coverage.json",
]
