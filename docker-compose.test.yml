# docker-compose.test.yml —— 集成测试专用 Postgres
services:
  pgtest:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: tentacle_test
    ports:
      - "55432:5432"          # 非默认端口，避免撞你本机 PG
    tmpfs:
      - /var/lib/postgresql/data    # 内存盘，测试快且不留痕
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d tentacle_test"]
      interval: 2s
      timeout: 3s
      retries: 15
